<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Aylesbury HSS </title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

body {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at top, #0f172a, #020617);
  padding:20px;
  color:#0f172a;
}

/* APP CARD */
.container {
  width:100%;
  max-width:420px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(20px);
  border-radius:24px;
  padding:28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

/* HEADER */
h1 {
  text-align:center;
  font-size:26px;
  font-weight:800;
  margin-bottom:6px;
}

.subtitle {
  text-align:center;
  font-size:13px;
  color:#64748b;
  margin-bottom:20px;
}

/* INPUTS */
input {
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:14px;
  border:1px solid #e2e8f0;
  background:#f8fafc;
  outline:none;
  transition:0.2s;
}

input:focus {
  border-color:#3b82f6;
  box-shadow:0 0 0 4px rgba(59,130,246,0.15);
  background:white;
}

/* GROUP GRID */
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0 18px;
}

.btn {
  padding:14px;
  border-radius:14px;
  border:none;
  background:#3b82f6;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

.btn:hover {
  transform:translateY(-2px);
}

.btn.active {
  background:#1e40af;
}

/* STATUS */
#msg {
  text-align:center;
  font-weight:600;
  margin:10px 0;
  min-height:20px;
}

.loading {
  color:#2563eb;
}

.success {
  color:#16a34a;
}

.error {
  color:#dc2626;
}

/* PRIMARY BUTTON */
.primary {
  width:100%;
  padding:16px;
  border-radius:16px;
  border:none;
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:white;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition:0.2s;
}

.primary:disabled {
  opacity:0.6;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div class="container">

<h1>HSS Shakha </h1>
<p class="subtitle">Fast & secure registration</p>

<input id="name" placeholder="Full Name" required>
<input id="email" placeholder="Email (optional)">
<input id="phone" placeholder="Phone (optional)">

<div class="grid">
<button class="btn" onclick="selectGroup(event,0,0)">0A + 0C</button>
<button class="btn" onclick="selectGroup(event,1,0)">1 Adult</button>
<button class="btn" onclick="selectGroup(event,2,0)">2 Adults</button>
<button class="btn" onclick="selectGroup(event,1,1)">1A + 1C</button>
<button class="btn" onclick="selectGroup(event,2,1)">2A + 1C</button>
<button class="btn" onclick="selectGroup(event,1,2)">1A + 2C</button>
</div>

<div id="msg"></div>

<button class="primary" onclick="checkIn()" id="submitBtn">
Register
</button>

</div>

<script>
const API_URL="https://sheetdb.io/api/v1/a0rzdx90pgkp5";

let selectedAdults=0;
let selectedChildren=0;

/* GROUP SELECT */
function selectGroup(e,a,c){
  selectedAdults=a;
  selectedChildren=c;

  document.querySelectorAll(".btn").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
}

/* MESSAGE UI */
function setMsg(text,type){
  const msg=document.getElementById("msg");
  msg.innerText=text;
  msg.className=type;
}

/* CHECK DUPLICATE */
async function isDuplicate(email){
  const res=await fetch(API_URL);
  const data=await res.json();

  return data.some(r =>
    email &&
    r.email &&
    r.email.toLowerCase() === email.toLowerCase()
  );
}

/* CHECK IN */
async function checkIn(){

  const name=nameInput.value.trim();
  const email=emailInput.value.trim();
  const phone=phoneInput.value.trim();

  if(!name){
    setMsg("Please enter name","error");
    return;
  }

  setMsg("Registering...","loading");
  document.getElementById("submitBtn").disabled=true;

  // DUPLICATE CHECK
  const duplicate=await isDuplicate(email);

  if(duplicate){
    setMsg("Already registered","error");
    document.getElementById("submitBtn").disabled=false;
    return;
  }

  try {
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        data:[{
          name,
          email,
          phone,
          adults:selectedAdults,
          children:selectedChildren,
          time:new Date().toISOString()
        }]
      })
    });

    setMsg("Successfully registered","success");

    localStorage.setItem("name",name);
    localStorage.setItem("email",email);
    localStorage.setItem("phone",phone);

  } catch(err){
    setMsg("Error occurred","error");
  }

  document.getElementById("submitBtn").disabled=false;
}

/* AUTO FILL */
const nameInput=document.getElementById("name");
const emailInput=document.getElementById("email");
const phoneInput=document.getElementById("phone");

window.onload=()=>{
  nameInput.value=localStorage.getItem("name")||"";
  emailInput.value=localStorage.getItem("email")||"";
  phoneInput.value=localStorage.getItem("phone")||"";
};
</script>

</body>
</html>
