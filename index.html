<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aylesbury HSS</title>

<style>
*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1f2937,#0b1220);
  color:white;
  padding:20px;
}

.container{
  width:360px;
  background:rgba(17,24,39,0.92);
  padding:24px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,0.06);
}

h2{
  text-align:center;
}

.input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:14px;
  border:none;
  background:#111827;
  color:white;
}

.counter-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111827;
  padding:12px;
  border-radius:14px;
  margin-top:10px;
}

.counter button{
  width:34px;
  height:34px;
  border:none;
  border-radius:10px;
  background:#1f2937;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.primary{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:none;
  border-radius:14px;
  font-weight:600;
  color:white;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
}

.secondary{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#111827;
  color:#cbd5e1;
}

.status{
  text-align:center;
  margin-top:12px;
}

#adminPanel{
  display:none;
  margin-top:18px;
  background:#0f172a;
  padding:18px;
  border-radius:18px;
}
</style>
</head>

<body>

<div class="container">

<h2>Aylesbury HSS</h2>

<input class="input" id="name" placeholder="Full Name">
<input class="input" id="phone" placeholder="Phone Number">
<input class="input" id="email" placeholder="Email (Optional)">

<div class="counter-box">
  <div>Adults</div>
  <div>
    <button onclick="change('adults',-1)">−</button>
    <span id="adults">0</span>
    <button onclick="change('adults',1)">+</button>
  </div>
</div>

<div class="counter-box">
  <div>Children</div>
  <div>
    <button onclick="change('children',-1)">−</button>
    <span id="children">0</span>
    <button onclick="change('children',1)">+</button>
  </div>
</div>

<label style="display:flex;gap:8px;margin-top:12px;font-size:12px;">
<input type="checkbox" id="consent">
I agree to GDPR
</label>

<button class="primary" onclick="submitData()" id="submitBtn">Check In</button>
<button class="secondary" onclick="openAdmin()">Admin Dashboard</button>

<div class="status" id="status"></div>

<div id="adminPanel">
  <h3>Admin Dashboard</h3>

  <div class="counter-box">
    <div>Total Adults</div>
    <div id="adminAdults">0</div>
  </div>

  <div class="counter-box">
    <div>Total Children</div>
    <div id="adminChildren">0</div>
  </div>

  <div class="counter-box">
    <div>Grand Total</div>
    <div id="adminTotal">0</div>
  </div>

  <button class="secondary" onclick="closeAdmin()">Close</button>
</div>

</div>

<script>

const API_URL = "https://sheetdb.io/api/v1/z3paa65c0tq9q";
const ADMIN_PIN = "1234";

let adults = 0;
let children = 0;

/* ---------------- WEEK SYSTEM (FIXED) ---------------- */
function getHSSWeekKey() {
    const today = new Date();

    // Thursday decides the ISO week
    const target = new Date(today.valueOf());
    const dayNr = (today.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);

    const firstThursday = new Date(target.getFullYear(), 0, 4);
    const firstDayNr = (firstThursday.getDay() + 6) % 7;
    firstThursday.setDate(firstThursday.getDate() - firstDayNr + 3);

    const weekNumber =
        1 + Math.round((target - firstThursday) / 604800000);

    return `Week ${weekNumber}`;

/* ---------------- COUNTERS ---------------- */
function change(type,val){
  if(type==="adults"){
    adults = Math.max(0, adults + val);
    document.getElementById("adults").innerText = adults;
  }
  if(type==="children"){
    children = Math.max(0, children + val);
    document.getElementById("children").innerText = children;
  }
}

/* ---------------- STATUS ---------------- */
function setStatus(msg,color="#fff"){
  const s = document.getElementById("status");
  s.innerText = msg;
  s.style.color = color;
}

/* ---------------- SUBMIT ---------------- */
  if(btn.disabled) return;
async function submitData(){

  const btn = document.getElementById("submitBtn");

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const consent = document.getElementById("consent").checked;

  if(!name || !phone){
    setStatus("Fill required fields","#fca5a5");
    return;
  }

  if(adults + children < 1){
    setStatus("Add attendees","#fca5a5");
    return;
  }

  if(!consent){
    setStatus("Accept GDPR","#fca5a5");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Saving...";

  try{

    const res = await fetch(API_URL);
    const data = await res.json();

    const currentWeek = getHSSWeekKey();

    const cleanPhone = phone.replace(/\D/g,'').replace(/^44/,'0');
    const cleanEmail = email.toLowerCase();

    const exists = data.some(item => {
      if(item.week !== currentWeek) return false;

     const sp = (item.phone||"").replace(/\D/g,'').replace(/^44/,'0');
      const se = (item.email||"").toLowerCase();

      return sp === cleanPhone || (cleanEmail && se === cleanEmail);
    });

    if(exists){
      setStatus("Already registered","#fbbf24");
      btn.disabled = false;
      btn.innerText = "Check In";
      return;
    }

    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        data:[{
          name,
          phone,
          email: email || "",
          adults,
          children,
          week: currentWeek,
          date: new Date().toLocaleDateString('en-GB'),
month: new Date().toLocaleString('en-GB',{month:'long'})
        
        }]
      })
    });

    setStatus("Registered ✔","#86efac");

    document.getElementById("name").value = "";
document.getElementById("phone").value = "";
document.getElementById("email").value = "";
document.getElementById("consent").checked = false;

    adults = 0;
    children = 0;
    document.getElementById("adults").innerText = 0;
    document.getElementById("children").innerText = 0;

  }catch(e){
    setStatus("Error","#fca5a5");
  }

  btn.disabled = false;
  btn.innerText = "Check In";
}

/* ---------------- ADMIN ---------------- */
async function openAdmin(){

  const pin = prompt("Enter Admin PIN");
  if(pin !== ADMIN_PIN) return alert("Wrong PIN");

  const res = await fetch(API_URL);
  const data = await res.json();

  const currentWeek = getHSSWeekKey();

  let a = 0, c = 0;

  data.forEach(item=>{
    if(item.week === currentWeek){
      a += Number(item.adults)||0;
      c += Number(item.children)||0;
    }
  });

  document.getElementById("adminAdults").innerText = a;
  document.getElementById("adminChildren").innerText = c;
  document.getElementById("adminTotal").innerText = a + c;

  document.getElementById("adminPanel").style.display="block";
}

function closeAdmin(){
  document.getElementById("adminPanel").style.display="none";
}

</script>

</body>
</html>
