<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Check-In</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

body {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at top, #0f172a, #020617);
  padding:20px;
}

/* CARD */
.container {
  width:100%;
  max-width:420px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border-radius:24px;
  padding:26px;
  box-shadow: 0 25px 70px rgba(0,0,0,0.35);
}

/* HEADER */
h1 {
  text-align:center;
  font-size:26px;
  margin-bottom:6px;
}

.subtitle {
  text-align:center;
  font-size:13px;
  color:#64748b;
  margin-bottom:18px;
}

/* INPUTS */
input {
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:14px;
  border:1px solid #e2e8f0;
  background:#f8fafc;
  outline:none;
}

input:focus {
  border-color:#3b82f6;
  box-shadow:0 0 0 4px rgba(59,130,246,0.15);
  background:white;
}

/* COUNTERS */
.counter {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 0;
  padding:12px;
  background:#f1f5f9;
  border-radius:14px;
}

.counter button {
  padding:6px 12px;
  border:none;
  border-radius:10px;
  background:#3b82f6;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.counter span {
  font-weight:700;
  margin:0 10px;
}

/* STATUS */
#msg {
  text-align:center;
  min-height:20px;
  margin:10px 0;
  font-weight:600;
}

.loading { color:#2563eb; }
.success { color:#16a34a; }
.error { color:#dc2626; }

/* BUTTON */
.primary {
  width:100%;
  padding:16px;
  border-radius:16px;
  border:none;
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:white;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

.primary:disabled {
  opacity:0.6;
}
</style>
</head>

<body>

<div class="container">

<h1>Event Check-In</h1>
<p class="subtitle">Fast & simple registration</p>

<input id="name" placeholder="Full Name" required>
<input id="email" placeholder="Email (optional)">
<input id="phone" placeholder="Phone (optional)">

<!-- COUNTERS -->
<div class="counter">
  <div>👤 Adults</div>
  <div>
    <button type="button" onclick="changeAdults(-1)">-</button>
    <span id="adultCount">0</span>
    <button type="button" onclick="changeAdults(1)">+</button>
  </div>
</div>

<div class="counter">
  <div>👶 Children</div>
  <div>
    <button type="button" onclick="changeChildren(-1)">-</button>
    <span id="childCount">0</span>
    <button type="button" onclick="changeChildren(1)">+</button>
  </div>
</div>

<div id="msg"></div>

<button class="primary" id="btn" onclick="checkIn()">
Register
</button>

</div>

<script>
const API_URL="https://sheetdb.io/api/v1/a0rzdx90pgkp5";

let selectedAdults=0;
let selectedChildren=0;

/* COUNTERS */
function changeAdults(v){
  selectedAdults=Math.max(0,selectedAdults+v);
  document.getElementById("adultCount").innerText=selectedAdults;
}

function changeChildren(v){
  selectedChildren=Math.max(0,selectedChildren+v);
  document.getElementById("childCount").innerText=selectedChildren;
}

/* MESSAGE */
function setMsg(text,type){
  const msg=document.getElementById("msg");
  msg.innerText=text;
  msg.className=type;
}

/* DUPLICATE CHECK */
async function isDuplicate(email){
  const res=await fetch(API_URL);
  const data=await res.json();

  return data.some(r =>
    email &&
    r.email &&
    r.email.toLowerCase() === email.toLowerCase()
  );
}

/* CHECK-IN */
async function checkIn(){

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const phone=document.getElementById("phone").value.trim();

  if(!name){
    setMsg("Please enter name","error");
    return;
  }

  setMsg("Registering...","loading");
  document.getElementById("btn").disabled=true;

  const duplicate=await isDuplicate(email);

  if(duplicate){
    setMsg("Already registered","error");
    document.getElementById("btn").disabled=false;
    return;
  }

  try {
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        data:[{
          name,
          email,
          phone,
          adults:selectedAdults,
          children:selectedChildren,
          time:new Date().toISOString()
        }]
      })
    });

    setMsg("Successfully registered","success");

    localStorage.setItem("name",name);
    localStorage.setItem("email",email);
    localStorage.setItem("phone",phone);

  } catch(e){
    setMsg("Error occurred","error");
  }

  document.getElementById("btn").disabled=false;
}

/* AUTO FILL */
window.onload=()=>{
  document.getElementById("name").value=localStorage.getItem("name")||"";
  document.getElementById("email").value=localStorage.getItem("email")||"";
  document.getElementById("phone").value=localStorage.getItem("phone")||"";
};
</script>

</body>
</html>
