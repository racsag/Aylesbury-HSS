<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Event Check-In</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.container{
  background:#111827;
  padding:25px;
  border-radius:16px;
  width:320px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h2{text-align:center;}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

.counter{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.add{background:#22c55e;color:#000;}
.sub{background:#ef4444;color:#fff;}
.checkin{width:100%;background:#3b82f6;color:#fff;margin-top:10px;}
.adminBtn{width:100%;margin-top:10px;background:#f59e0b;}

.status{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}

.small{
  font-size:12px;
  opacity:0.7;
  text-align:center;
  margin-top:5px;
}

.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#1f2937;
  padding:20px;
  border-radius:12px;
  width:280px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Event Check-In</h2>

  <input id="name" placeholder="Name"/>
  <input id="phone" placeholder="Phone Number"/>

  <div class="counter">
    Adults:
    <div>
      <button class="sub" onclick="change('adults',-1)">-</button>
      <span id="adults">0</span>
      <button class="add" onclick="change('adults',1)">+</button>
    </div>
  </div>

  <div class="counter">
    Children:
    <div>
      <button class="sub" onclick="change('children',-1)">-</button>
      <span id="children">0</span>
      <button class="add" onclick="change('children',1)">+</button>
    </div>
  </div>

  <button class="checkin" onclick="checkIn()">Check In</button>
  <button class="adminBtn" onclick="openAdmin()">Admin</button>

  <div class="status" id="status"></div>
  <div class="small">Privacy mode: details clear after registration</div>
</div>

<!-- ADMIN MODAL -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h3>Admin Login</h3>
    <input id="adminPass" placeholder="Enter password"/>
    <button class="checkin" onclick="loginAdmin()">Login</button>

    <div id="adminPanel" style="display:none;margin-top:10px;">
      <h4>Summary</h4>
      <div id="summary"></div>
    </div>
  </div>
</div>

<script>
let adults = 0;
let children = 0;

let data = JSON.parse(localStorage.getItem("checkins") || "[]");

function change(type,val){
  if(type==="adults"){
    adults = Math.max(0, adults + val);
    document.getElementById("adults").innerText = adults;
  }
  if(type==="children"){
    children = Math.max(0, children + val);
    document.getElementById("children").innerText = children;
  }
}

function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

function checkIn(){
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if(!name || !phone){
    setStatus("Please fill details");
    return;
  }

  let existing = data.find(p => p.phone === phone);

  if(existing){
    setStatus("Already registered");
    return;
  }

  setStatus("Registering...");

  setTimeout(()=>{
    data.push({name, phone, adults, children});
    localStorage.setItem("checkins", JSON.stringify(data));

    setStatus("Registered ✔️");

    // privacy reset
    setTimeout(()=>{
      document.getElementById("name").value="";
      document.getElementById("phone").value="";
      adults=0;
      children=0;
      document.getElementById("adults").innerText=0;
      document.getElementById("children").innerText=0;
      setStatus("");
    },2000);

  },1000);
}

function openAdmin(){
  document.getElementById("adminModal").style.display="flex";
}

function loginAdmin(){
  const pass = document.getElementById("adminPass").value;

  if(pass !== "1234"){
    alert("Wrong password");
    return;
  }

  document.getElementById("adminPanel").style.display="block";

  let totalAdults = data.reduce((a,b)=>a+b.adults,0);
  let totalChildren = data.reduce((a,b)=>a+b.children,0);

  document.getElementById("summary").innerHTML = `
    Total Registrations: ${data.length}<br>
    Adults: ${totalAdults}<br>
    Children: ${totalChildren}
  `;
}
</script>

</body>
</html>
