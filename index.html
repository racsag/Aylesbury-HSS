<!DOCTYPE html>
<html lang="en-GB">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Aylesbury HSS </title>

<style>

body{
  margin:0;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(180deg,#f5f7ff,#eef2ff);
  color:#111;
}

.container{
  max-width:480px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:34px;
}

.card{
  background:white;
  border-radius:30px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

input{
  width:100%;
  padding:16px;
  margin:10px 0;
  border-radius:16px;
  border:1px solid #ddd;
  font-size:16px;
}

.counter-section{
  display:flex;
  gap:12px;
}

.counter-box{
  flex:1;
  background:#f6f7fb;
  padding:15px;
  border-radius:20px;
  text-align:center;
}

.counter-value{
  font-size:32px;
  font-weight:bold;
}

.circle-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:none;
  background:#007AFF;
  color:white;
  font-size:20px;
}

.checkin-btn{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:none;
  border-radius:20px;
  background:#007AFF;
  color:white;
  font-size:18px;
}

#msg{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}

.privacy{
  font-size:12px;
  color:#666;
  margin-top:12px;
  padding:10px;
  background:#f7f7f7;
  border-radius:12px;
}

.admin{
  margin-top:15px;
  background:white;
  border-radius:20px;
  padding:15px;
}

</style>

</head>

<body>

<div class="container">

<h1>Aylesbury HSS</h1>

<div class="card">

<input id="name" placeholder="Full Name"/>
<input id="email" placeholder="Email (optional)"/>
<input id="phone" placeholder="UK Mobile Number"/>

<div class="counter-section">

<div class="counter-box">
Adults
<div class="counter-value" id="adultCount">1</div>

<button class="circle-btn" onclick="changeAdults(-1)">−</button>
<button class="circle-btn" onclick="changeAdults(1)">+</button>

</div>

<div class="counter-box">
Children
<div class="counter-value" id="childCount">0</div>

<button class="circle-btn" onclick="changeChildren(-1)">−</button>
<button class="circle-btn" onclick="changeChildren(1)">+</button>
</div>

</div>

<div class="privacy">
By checking in, you agree your data is stored for event management and safety only (GDPR compliant).
</div>

<button class="checkin-btn" onclick="checkIn()">Check In</button>

<div id="msg"></div>

</div>

<div class="admin">
<button onclick="openAdmin()">Admin Dashboard</button>

<div id="stats" style="display:none;margin-top:10px;">
Total Adults: <span id="tAdults">0</span><br/>
Total Children: <span id="tChildren">0</span><br/>
Total People: <span id="tTotal">0</span>
</div>

</div>

</div>

<script>

const API_URL="https://sheetdb.io/api/v1/ce2vzb2cgzonz";
const ADMIN_PIN="1234";

let adults=1;
let children=0;

/* COUNTERS FIXED */
function changeAdults(v){
  adults+=v;
  if(adults<1) adults=1;
  document.getElementById("adultCount").innerText=adults;
}

function changeChildren(v){
  children+=v;
  if(children<0) children=0;
  document.getElementById("childCount").innerText=children;
}

/* UK PHONE CLEAN */
function cleanPhone(p){
  return p.replace(/\D/g,'');
}

/* TIME FIX */
function getTime(){
  return new Date().toLocaleString("en-GB",{
    day:"2-digit",
    month:"long",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

/* CHECK IN */
function checkIn(){

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim().toLowerCase();
  const phone=document.getElementById("phone").value.trim();

  const msg=document.getElementById("msg");

  if(!name||!phone){
    msg.innerText="Name & phone required";
    return;
  }

  const cleaned=cleanPhone(phone);

  if(!/^(\+44|0)7\d{9}$/.test(phone)){
    msg.innerText="Invalid UK number";
    return;
  }

  fetch(API_URL)
  .then(r=>r.json())
  .then(data=>{

    const exists=data.some(x=>{
      return cleanPhone(x.emergency_contact||"")===cleaned;
    });

    if(exists){
      msg.innerText="Already checked in";
      return;
    }

    fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        data:[{
          name,
          email,
          emergency_contact:cleaned,
          adults,
          children,
          total:adults+children,
          time:getTime()
        }]
      })
    })
    .then(()=>{
      msg.innerText="Checked in successfully!";
      adults=1;
      children=0;
      document.getElementById("adultCount").innerText=1;
      document.getElementById("childCount").innerText=0;
    });

  });

}

/* ADMIN */
function openAdmin(){

  const pin=prompt("Enter PIN");

  if(pin!==ADMIN_PIN) return;

  document.getElementById("stats").style.display="block";

  fetch(API_URL)
  .then(r=>r.json())
  .then(data=>{

    let a=0,c=0;

    data.forEach(x=>{
      a+=Number(x.adults||0);
      c+=Number(x.children||0);
    });

    document.getElementById("tAdults").innerText=a;
    document.getElementById("tChildren").innerText=c;
    document.getElementById("tTotal").innerText=a+c;

  });

}

</script>

</body>
</html>
