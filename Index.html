<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aylesbury HSS</title>

<style>
*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1f2937,#0b1220);
  color:white;
  padding:20px;
}

.container{
  width:360px;
  background:rgba(17,24,39,0.92);
  padding:24px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 25px 60px rgba(0,0,0,0.6);
}

h2{
  text-align:center;
}

.input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:14px;
  border:none;
  background:#111827;
  color:white;
}

.counter-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111827;
  padding:12px;
  border-radius:14px;
  margin-top:10px;
}

.counter button{
  width:34px;
  height:34px;
  border:none;
  border-radius:10px;
  background:#1f2937;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.count{
  min-width:24px;
  text-align:center;
  font-weight:600;
}

.primary{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:none;
  border-radius:14px;
  font-weight:600;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
}

.secondary{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#111827;
  color:#cbd5e1;
  cursor:pointer;
}

.status{
  text-align:center;
  margin-top:12px;
  min-height:20px;
  font-weight:600;
}

#adminPanel{
  display:none;
  margin-top:18px;
  background:#0f172a;
  padding:18px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.08);
}
</style>
</head>

<body>

<div class="container">

<h2>Aylesbury HSS</h2>

<input class="input" id="name" placeholder="Full Name">
<input class="input" id="phone" placeholder="Phone Number">
<input class="input" id="email" placeholder="Email (Optional)">

<div class="counter-box">
  <div>Adults</div>
  <div class="counter">
    <button onclick="change('adults',-1)">−</button>
    <div id="adults">0</div>
    <button onclick="change('adults',1)">+</button>
  </div>
</div>

<div class="counter-box">
  <div>Children</div>
  <div class="counter">
    <button onclick="change('children',-1)">−</button>
    <div id="children">0</div>
    <button onclick="change('children',1)">+</button>
  </div>
</div>

<label style="display:flex;gap:8px;margin-top:12px;font-size:12px;color:#cbd5e1;">
<input type="checkbox" id="consent">
I agree to GDPR & Data Privacy
</label>

<button class="primary" id="submitBtn" onclick="submitData()">Check In</button>
<button class="secondary" onclick="openAdmin()">Admin Dashboard</button>

<div class="status" id="status"></div>

<div id="adminPanel">
  <h3>Admin Dashboard</h3>

  <div class="counter-box">
    <div>Total Adults</div>
    <div id="adminAdults">0</div>
  </div>

  <div class="counter-box">
    <div>Total Children</div>
    <div id="adminChildren">0</div>
  </div>

  <div class="counter-box">
    <div>Grand Total</div>
    <div id="adminTotal">0</div>
  </div>

  <button class="secondary" onclick="closeAdmin()">Close</button>
</div>

</div>

<script>

const API_URL = "https://sheetdb.io/api/v1/z3paa65c0tq9q";
const ADMIN_PIN = "1234";

let adults = 0;
let children = 0;

function normalizePhone(phone){
  return phone.replace(/\s/g,'').replace(/^\+44/,'0');
}

function change(type,val){
  if(type==="adults"){
    adults = Math.max(0, adults + val);
    document.getElementById("adults").innerText = adults;
  }

  if(type==="children"){
    children = Math.max(0, children + val);
    document.getElementById("children").innerText = children;
  }
}

function setStatus(msg,color="#fff"){
  const status = document.getElementById("status");
  status.innerText = msg;
  status.style.color = color;
}

/* ✅ FINAL WEEK FORMAT */
function getHSSWeekKey(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const diff = now - start;
  const weekNum = Math.ceil(diff / (1000 * 60 * 60 * 24 * 7));
  return `Week ${weekNum}`;
}

async function submitData(){

  const btn = document.getElementById("submitBtn");

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const consent = document.getElementById("consent").checked;

  if(!name || !phone){
    setStatus("Please fill required fields","#fca5a5");
    return;
  }

  if(adults + children < 1){
    setStatus("Add at least 1 attendee","#fca5a5");
    return;
  }

  if(!consent){
    setStatus("Please accept GDPR consent","#fca5a5");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Registering...";

  try{

    const res = await fetch(API_URL);
    const data = await res.json();

    const cleanedPhone = normalizePhone(phone);
    const cleanedEmail = email.toLowerCase();
    const currentWeek = getHSSWeekKey();

    const exists = data.some(item => {
      if(item.week !== currentWeek) return false;

      const savedPhone = normalizePhone(String(item.phone || ''));
      const savedEmail = String(item.email || '').toLowerCase();

      return (
        savedPhone === cleanedPhone ||
        (cleanedEmail && savedEmail === cleanedEmail)
      );
    });

    if(exists){
      setStatus("Already registered","#fbbf24");
      btn.disabled = false;
      btn.innerText = "Check In";
      return;
    }

    const post = await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        data:[{
          name,
          phone,
          email: email || "",
          adults,
          children,
          week: currentWeek,
          month: new Date().toLocaleString('en-GB',{month:'long'})
        }]
      })
    });

    if(post.ok){
      setStatus("Registered Successfully ✔","#86efac");

      setTimeout(()=>{
        document.getElementById("name").value="";
        document.getElementById("phone").value="";
        document.getElementById("email").value="";
        document.getElementById("consent").checked=false;

        adults = 0;
        children = 0;

        document.getElementById("adults").innerText=0;
        document.getElementById("children").innerText=0;

        setStatus("");

        btn.disabled=false;
        btn.innerText="Check In";
      },1500);
    }

  }catch(e){
    setStatus("Connection error","#fca5a5");
    btn.disabled=false;
    btn.innerText="Check In";
  }
}

async function openAdmin(){

  const pin = prompt("Enter Admin PIN");
  if(pin !== ADMIN_PIN) return alert("Wrong PIN");

  const res = await fetch(API_URL);
  const data = await res.json();

  const currentWeek = getHSSWeekKey();

  let totalAdults = 0;
  let totalChildren = 0;

  data.forEach(item=>{
    if(item.week === currentWeek){
      totalAdults += parseInt(item.adults||0);
      totalChildren += parseInt(item.children||0);
    }
  });

  document.getElementById("adminAdults").innerText = totalAdults;
  document.getElementById("adminChildren").innerText = totalChildren;
  document.getElementById("adminTotal").innerText = totalAdults + totalChildren;

  document.getElementById("adminPanel").style.display="block";
}

function closeAdmin(){
  document.getElementById("adminPanel").style.display="none";
}

</script>

</body>
  </html>
